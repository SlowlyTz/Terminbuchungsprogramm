<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Raumbuchung</title>
  <style>
    :root { color-scheme: light dark; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center;
           font-family: system-ui, sans-serif; background: #f4f6f8; color: #1a1a1a; }
    @media (prefers-color-scheme: dark) { body { background: #121417; color: #e6e6e6; } }
    main { text-align: center; padding: 2rem; max-width: 40rem; }
    h1 { font-size: 2rem; margin-bottom: .5rem; }
    p { font-size: 1.1rem; line-height: 1.5; }
    code { background: rgba(127,127,127,.15); padding: .1em .4em; border-radius: 4px; }
  </style>
</head>
<body>
  <main>
    <h1>Raumbuchung</h1>
    <p>Web-Anwendung zur Buchung von Meetingräumen.</p>
    <p>Der Server läuft. Status: <code>/api/health</code></p>
  </main>
</body>
</html>
