<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ER-Modell Raumbuchung</title>
<meta name="description" content="Entity-Relationship-Modell der MariaDB-Datenbank für die Meetingraum-Buchung mit Einladungen (LF10, Stack A).">
<style>
  :root {
    --bg: #f4f4f4;
    --surface: #ffffff;
    --text: #111111;
    --muted: #666666;
    --line: #d0d0d0;
    --stroke: #222222;
    --head: #ededed;
    --head-junction: #d9d9d9;
    --head-optional: #ffffff;
    --head-tech: #f6f6f6;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #161616; --surface: #1f1f1f; --text: #f0f0f0; --muted: #a0a0a0; --line: #3a3a3a;
      --stroke: #e0e0e0; --head: #2c2c2c; --head-junction: #3a3a3a; --head-optional: #1f1f1f; --head-tech: #262626;
    }
  }
  :root[data-theme="dark"] {
    --bg: #161616; --surface: #1f1f1f; --text: #f0f0f0; --muted: #a0a0a0; --line: #3a3a3a;
    --stroke: #e0e0e0; --head: #2c2c2c; --head-junction: #3a3a3a; --head-optional: #1f1f1f; --head-tech: #262626;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  main { max-width: 1900px; margin: 0 auto; padding: 24px 16px 48px; }
  h1 { font-size: 1.5rem; margin: 0 0 16px; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 16px; overflow-x: auto; }
  svg { display: block; width: 100%; height: auto; min-width: 1100px; font-family: inherit; }
  .legend { display: flex; flex-wrap: wrap; justify-content: space-between; row-gap: 12px; margin-top: 20px; font-size: 1.05rem; color: var(--muted); }
  .legend span { display: inline-flex; align-items: center; gap: 8px; }
  .sw { width: 22px; height: 14px; border-radius: 2px; border: 2px solid var(--stroke); display: inline-block; background: var(--surface); }
  .sw.junction { background: var(--head-junction); }
  .sw.tech { border-style: dotted; }
  .sw.diamond { width: 16px; height: 16px; transform: rotate(45deg) scale(0.8); border-radius: 0; }
</style>
</head>
<body>
<main>
  <section class="card" aria-label="ER-Diagramm">
    <h1>ER-Modell Raumbuchung</h1>
    <svg id="erd" viewBox="0 0 1700 1195" role="img" aria-labelledby="erd-title">
      <title id="erd-title">Entity-Relationship-Diagramm der Raumbuchungs-Datenbank</title>
    </svg>
    <div class="legend">
      <span><i class="sw"></i> Entität</span>
      <span><i class="sw junction"></i> Zwischentabelle (n:m)</span>
      <span><i class="sw diamond"></i> Beziehung</span>
      <span><i class="sw tech"></i> technisch – kein Fremdschlüssel</span>
      <span><u>unterstrichen</u> = Primärschlüssel</span>
      <span><em>(FK)</em> = Fremdschlüssel</span>
    </div>
  </section>
</main>

<script>
(function () {
  // ---------- Modelldefinition ----------
  // kind: core | junction | optional | tech
  // attrs: { n: name, t: MariaDB-Typ, pk: bool, fk: 'tabelle.spalte', null: bool, d: Beschreibung }
  const entities = [
    { id: 'departments', kind: 'core', x: 40, y: 300, w: 230, badge: null, desc: 'Abteilungen der Mitarbeitenden (Stammdaten, Admin pflegt).',
      attrs: [
        { n: 'department_id', t: 'INT UNSIGNED', pk: true, d: 'Primärschlüssel' },
        { n: 'name', t: 'VARCHAR(100)', d: 'Abteilungsname, UNIQUE' },
        { n: 'is_active', t: 'BOOLEAN', d: 'Deaktivieren statt löschen' },
      ] },
    { id: 'roles', kind: 'core', x: 40, y: 460, w: 230, badge: null, desc: 'Berechtigungsrollen (Seed: „Nutzer“, „Admin“).',
      attrs: [
        { n: 'role_id', t: 'INT UNSIGNED', pk: true, d: 'Primärschlüssel' },
        { n: 'name', t: 'VARCHAR(50)', d: 'Rollenname, UNIQUE' },
        { n: 'is_active', t: 'BOOLEAN', d: 'Deaktivieren statt löschen' },
      ] },
    { id: 'password_reset_tokens', kind: 'core', x: 40, y: 620, w: 230, badge: null, desc: 'Einmal-Tokens für „Passwort zurücksetzen“. Rein technisch, daher ohne is_active.',
      attrs: [
        { n: 'password_reset_token_id', t: 'INT UNSIGNED', pk: true, d: 'Primärschlüssel' },
        { n: 'user_id', t: 'INT UNSIGNED', fk: 'users.user_id', d: 'Betroffener Nutzer, ON DELETE CASCADE' },
        { n: 'token_hash', t: 'CHAR(64)', d: 'SHA-256 des Tokens, UNIQUE' },
        { n: 'expires_at', t: 'DATETIME', d: 'Ablauf (z. B. +1 h)' },
        { n: 'used_at', t: 'DATETIME', null: true, d: 'Einlösezeitpunkt; NULL = offen' },
        { n: 'created_at', t: 'DATETIME', d: 'Erstellzeitpunkt' },
      ] },
    { id: 'sessions', kind: 'tech', x: 40, y: 880, w: 230, badge: 'Session-Store · kein FK', desc: 'Tabelle des express-session-Stores (express-mysql-session). Struktur von der Bibliothek vorgegeben.',
      attrs: [
        { n: 'session_id', t: 'VARCHAR(128)', pk: true, d: 'Session-ID aus dem Cookie' },
        { n: 'expires', t: 'INT UNSIGNED', d: 'Ablauf als Unix-Zeit' },
        { n: 'data', t: 'MEDIUMTEXT', d: 'Session-JSON (enthält user_id)' },
      ] },
    { id: 'users', kind: 'core', x: 470, y: 310, w: 240, badge: null, desc: 'Alle ~300 Mitarbeitenden. Anlegen nur durch Admin; Login mit E-Mail + bcrypt-Hash. Ausscheiden = is_active 0, Verweise bleiben.',
      attrs: [
        { n: 'user_id', t: 'INT UNSIGNED', pk: true, d: 'Primärschlüssel' },
        { n: 'department_id', t: 'INT UNSIGNED', fk: 'departments.department_id', null: true, d: 'Abteilung' },
        { n: 'role_id', t: 'INT UNSIGNED', fk: 'roles.role_id', d: 'Rolle (Nutzer/Admin)' },
        { n: 'email', t: 'VARCHAR(255)', d: 'Login-Name, UNIQUE' },
        { n: 'password_hash', t: 'VARCHAR(72)', d: 'bcrypt-Hash (technisch, in place)' },
        { n: 'first_name', t: 'VARCHAR(100)', d: 'Vorname' },
        { n: 'last_name', t: 'VARCHAR(100)', d: 'Nachname' },
        { n: 'failed_login_count', t: 'TINYINT UNSIGNED', d: 'Fehlversuche seit letztem Erfolg' },
        { n: 'locked_until', t: 'DATETIME', null: true, d: 'Sperre nach Fehlversuchen' },
        { n: 'is_active', t: 'BOOLEAN', d: 'Deaktivieren statt löschen, Default 1' },
        { n: 'created_at', t: 'DATETIME', d: 'Anlagezeitpunkt' },
        { n: 'updated_at', t: 'DATETIME', d: 'Letzte Änderung (ON UPDATE)' },
      ] },
    { id: 'booking_participants', kind: 'junction', x: 900, y: 850, w: 250, badge: null, desc: 'Einladung einer Person zu einem Meeting (nicht zu einer einzelnen Version – gilt über Verschiebungen hinweg). Unveränderlich: Antwort = neue Zeile, Entfernen = is_active 0. Der Veranstalter steht nicht hier (organizer_id).',
      attrs: [
        { n: 'booking_participant_id', t: 'INT UNSIGNED', pk: true, d: 'Primärschlüssel dieses Datensatzes – fortlaufende Nummer, kein Bezug zu bookings (anders benannt als booking_id, um Verwechslung mit einer Buchung auszuschließen). Nötig, weil dieselbe Person mehrfach zum selben Meeting vorkommen kann (eingeladen → angenommen; entfernt → erneut eingeladen)' },
        { n: 'meeting_id', t: 'INT UNSIGNED', d: 'Meeting, zu dem eingeladen wird (bookings.meeting_id) – einzige Verknüpfung zur Buchung; kein FK, da bookings.meeting_id nicht eindeutig ist – Trigger prüft die Existenz' },
        { n: 'user_id', t: 'INT UNSIGNED', fk: 'users.user_id', d: 'Eingeladene Person' },
        { n: 'role', t: "ENUM('pflicht','optional')", d: 'Wie in Teams: erforderlich / optional' },
        { n: 'status', t: "ENUM('eingeladen','angenommen','abgelehnt')", d: 'Antwortstand dieser Zeile' },
        { n: 'comment', t: 'VARCHAR(255)', null: true, d: 'Antwortkommentar („erst ab 10 Uhr“)' },
        { n: 'created_by_id', t: 'INT UNSIGNED', fk: 'users.user_id', d: 'Wer die Zeile angelegt hat (Einladender bzw. Antwortender)' },
        { n: 'created_at', t: 'DATETIME', d: 'Zeitpunkt der Einladung/Antwort' },
        { n: 'is_active', t: 'BOOLEAN', d: '0 = entfernt oder durch neuere Antwort ersetzt' },
        { n: 'deactivated_by_id', t: 'INT UNSIGNED', fk: 'users.user_id', null: true, d: 'Wer entfernt/ersetzt hat' },
        { n: 'deactivated_at', t: 'DATETIME', null: true, d: 'Zeitpunkt der Deaktivierung' },
      ] },
    { id: 'bookings', kind: 'core', x: 940, y: 300, w: 250, badge: null, desc: 'Eine Version einer Raumreservierung. booking_id = fortlaufende Nummer dieser Version, meeting_id = feste ID des Meetings über alle Versionen hinweg (eigene Sequenz, kein FK). Unveränderlich: Änderung = neue Zeile, alte wird inaktiv.',
      attrs: [
        { n: 'booking_id', t: 'INT UNSIGNED', pk: true, d: 'Primärschlüssel – fortlaufende Nummer dieser Version' },
        { n: 'meeting_id', t: 'INT UNSIGNED', d: 'ID des Meetings, aus eigener Sequenz meeting_seq – unabhängig von booking_id, bleibt bei jeder Änderung gleich; kein FK' },
        { n: 'room_id', t: 'INT UNSIGNED', fk: 'rooms.room_id', d: 'Gebuchter Raum' },
        { n: 'organizer_id', t: 'INT UNSIGNED', fk: 'users.user_id', d: 'Veranstalter („gebucht für“), zählt zur Kapazität' },
        { n: 'booking_series_id', t: 'INT UNSIGNED', fk: 'booking_series.booking_series_id', null: true, d: 'Zugehörige Serie; NULL = Einzeltermin' },
        { n: 'starts_at', t: 'DATETIME', d: 'Beginn (UTC)' },
        { n: 'ends_at', t: 'DATETIME', d: 'Ende (UTC), CHECK ends_at > starts_at' },
        { n: 'title', t: 'VARCHAR(200)', null: true, d: 'Besprechungstitel (optional)' },
        { n: 'guest_count', t: 'SMALLINT UNSIGNED', d: 'Externe Gäste ohne Konto, Default 0' },
        { n: 'catering', t: 'VARCHAR(255)', null: true, d: 'Catering-Wunsch (optional)' },
        { n: 'status', t: "ENUM('geplant','abgesagt')", d: 'Fachlicher Zustand dieser Version' },
        { n: 'created_by_id', t: 'INT UNSIGNED', fk: 'users.user_id', d: 'Wer diese Version angelegt hat (Veranstalter oder Admin)' },
        { n: 'created_at', t: 'DATETIME', d: 'Anlagezeitpunkt der Version' },
        { n: 'is_active', t: 'BOOLEAN', d: '1 = aktuelle Version, 0 = Historie' },
        { n: 'deactivated_by_id', t: 'INT UNSIGNED', fk: 'users.user_id', null: true, d: 'Wer die Version abgelöst/deaktiviert hat' },
        { n: 'deactivated_at', t: 'DATETIME', null: true, d: 'Zeitpunkt der Deaktivierung' },
      ] },
    { id: 'booking_series', kind: 'core', x: 940, y: 20, w: 250, badge: null, desc: 'Wiederholungsregel (z. B. wöchentliches Jour fixe) einer Serie. Jede Wiederholung ist ein eigenes Meeting mit eigener bookings-Zeile, die über booking_series_id hierher zurückzeigt – die Serie selbst kennt ihre Meetings nicht einzeln.',
      attrs: [
        { n: 'booking_series_id', t: 'INT UNSIGNED', pk: true, d: 'Primärschlüssel' },
        { n: 'frequency', t: "ENUM('täglich','wöchentlich','monatlich')", d: 'Wiederholungsart' },
        { n: 'interval_value', t: 'TINYINT UNSIGNED', d: 'Jede n-te Einheit, Default 1' },
        { n: 'until_date', t: 'DATE', d: 'Letzter Termin der Serie' },
        { n: 'is_active', t: 'BOOLEAN', d: 'Serie beendet = 0' },
      ] },
    { id: 'rooms', kind: 'core', x: 1410, y: 110, w: 250, badge: null, desc: 'Buchbare Meetingräume (Admin pflegt). Deaktivieren statt löschen, damit Alt-Buchungen erhalten bleiben.',
      attrs: [
        { n: 'room_id', t: 'INT UNSIGNED', pk: true, d: 'Primärschlüssel' },
        { n: 'name', t: 'VARCHAR(100)', d: 'Raumname (z. B. „Kaiserslautern“), UNIQUE' },
        { n: 'building', t: 'VARCHAR(100)', null: true, d: 'Gebäude/Standort' },
        { n: 'floor', t: 'VARCHAR(20)', null: true, d: 'Etage' },
        { n: 'capacity', t: 'SMALLINT UNSIGNED', d: 'Maximale Personenzahl, CHECK > 0 – Grenze für Einladungen' },
        { n: 'description', t: 'TEXT', null: true, d: 'Freitext/Hinweise' },
        { n: 'is_active', t: 'BOOLEAN', d: 'Buchbar ja/nein, Default 1' },
        { n: 'created_at', t: 'DATETIME', d: 'Anlagezeitpunkt' },
        { n: 'updated_at', t: 'DATETIME', d: 'Letzte Änderung (ON UPDATE)' },
      ] },
    { id: 'room_equipment', kind: 'junction', x: 1410, y: 480, w: 250, badge: null, desc: 'Löst rooms n:m equipment auf. Eigener Schlüssel room_equipment_id statt zusammengesetztem PK.',
      attrs: [
        { n: 'room_equipment_id', t: 'INT UNSIGNED', pk: true, d: 'Primärschlüssel' },
        { n: 'room_id', t: 'INT UNSIGNED', fk: 'rooms.room_id', d: 'Raum' },
        { n: 'equipment_id', t: 'INT UNSIGNED', fk: 'equipment.equipment_id', d: 'Ausstattung' },
        { n: 'quantity', t: 'SMALLINT UNSIGNED', d: 'Anzahl, Default 1' },
        { n: 'is_active', t: 'BOOLEAN', d: 'Ausstattung entfernt = 0' },
      ] },
    { id: 'equipment', kind: 'core', x: 1410, y: 740, w: 250, badge: null, desc: 'Ausstattungsmerkmale (Seed: Beamer, Whiteboard, Videokonferenz, …).',
      attrs: [
        { n: 'equipment_id', t: 'INT UNSIGNED', pk: true, d: 'Primärschlüssel' },
        { n: 'name', t: 'VARCHAR(100)', d: 'Bezeichnung, UNIQUE' },
        { n: 'is_active', t: 'BOOLEAN', d: 'Deaktivieren statt löschen' },
      ] },
  ];

  // Beziehungen: genau eine Linie pro Entitätspaar. Verb in der Raute, FK-Spalten als Untertitel (String oder Zeilen-Array).
  // Endpunkte: [entity, seite, offset]; ca/cb = Kardinalität am jeweiligen Ende; subSide = Seite des Untertitels bei senkrechten Linien
  // self: reflexive Beziehung – beide Enden an derselben Entität, Raute an fester Position (cx, cy)
  const relations = [
    { a: ['departments', 'right', 350], b: ['users', 'left', 380], ca: '1', cb: 'n', verb: 'gehört zu', fks: 'department_id' },
    { a: ['roles', 'right', 510],       b: ['users', 'left', 480], ca: '1', cb: 'n', verb: 'hat Rolle', fks: 'role_id' },
    { a: ['password_reset_tokens', 'right', 700], b: ['users', 'left', 560], ca: 'n', cb: '1', verb: 'gehört zu', fks: 'user_id' },
    { a: ['users', 'right', 470], b: ['bookings', 'left', 470], ca: '1', cb: 'n', verb: 'bucht / bearbeitet', dw: 100, fks: ['organizer_id — Veranstalter', 'created_by_id — angelegt', 'deactivated_by_id — entfernt'] },
    { a: ['bookings', 'right', 340], b: ['rooms', 'left', 340], ca: 'n', cb: '1', verb: 'belegt', fks: 'room_id' },
    { a: ['rooms', 'bottom', 1535], b: ['room_equipment', 'top', 1535], ca: 'n', cb: '', verb: 'hat', fks: 'room_id', vertical: true },
    { a: ['room_equipment', 'bottom', 1535], b: ['equipment', 'top', 1535], ca: '', cb: 'm', verb: 'ist', fks: 'equipment_id', vertical: true },
    { a: ['bookings', 'top', 1065], b: ['booking_series', 'bottom', 1065], ca: 'n', cb: '1', verb: 'gehört zu', fks: 'booking_series_id', vertical: true },
    { a: ['users', 'bottom', 700], b: ['booking_participants', 'top', 960], ca: 'n', cb: '', verb: 'nimmt teil', fks: ['user_id — Teilnehmer', 'created_by_id / deactivated_by_id — Verlauf'], vertical: true, subSide: 'left' },
    { a: ['bookings', 'bottom', 1065], b: ['booking_participants', 'top', 1065], ca: 'm', cb: '', verb: 'lädt ein', fks: 'meeting_id', vertical: true },
  ];

  // ---------- Rendering SVG ----------
  const NS = 'http://www.w3.org/2000/svg';
  const HEAD = 36, ROW = 22, PAD = 8;
  const DW = 72, DH = 30; // halbe Rautenbreite/-höhe
  const style = {
    core:     { head: 'var(--head)',          dash: '' },
    junction: { head: 'var(--head-junction)', dash: '' },
    optional: { head: 'var(--head-optional)', dash: '8 5' },
    tech:     { head: 'var(--head-tech)',     dash: '2 4' },
  };
  const byId = {};
  entities.forEach(e => { e.h = HEAD + e.attrs.length * ROW + PAD; byId[e.id] = e; });

  const svg = document.getElementById('erd');
  const el = (tag, attrs, text) => {
    const n = document.createElementNS(NS, tag);
    for (const k in attrs) n.setAttribute(k, attrs[k]);
    if (text != null) n.textContent = text;
    return n;
  };
  const anchor = ([id, side, off]) => {
    const e = byId[id];
    switch (side) {
      case 'left':   return { x: e.x, y: off };
      case 'right':  return { x: e.x + e.w, y: off };
      case 'top':    return { x: off, y: e.y };
      case 'bottom': return { x: off, y: e.y + e.h };
    }
  };
  // Kardinalität: 14 px vom Endpunkt P Richtung Q entlang der Linie, 13 px senkrecht versetzt
  const cardText = (g, P, Q, txt) => {
    const dx = Q.x - P.x, dy = Q.y - P.y, len = Math.hypot(dx, dy), ux = dx / len, uy = dy / len;
    g.appendChild(el('text', { x: P.x + ux * 14 - uy * 13, y: P.y + uy * 14 + ux * 13 + 6,
      'text-anchor': 'middle', 'font-size': 17, 'font-weight': 700, fill: 'var(--text)' }, txt));
  };

  // Linien + Rauten zuerst (liegen unter den Kästen)
  const gLines = el('g', {});
  relations.forEach(r => {
    const A = anchor(r.a), B = anchor(r.b);
    const dash = r.optional ? '8 5' : '';
    const M = r.self ? { x: r.cx, y: r.cy } : { x: (A.x + B.x) / 2, y: (A.y + B.y) / 2 };
    const lineAttrs = { stroke: 'var(--stroke)', 'stroke-width': 1.6, 'stroke-dasharray': dash };
    gLines.appendChild(el('line', { x1: A.x, y1: A.y, x2: M.x, y2: M.y, ...lineAttrs }));
    gLines.appendChild(el('line', { x1: M.x, y1: M.y, x2: B.x, y2: B.y, ...lineAttrs }));
    cardText(gLines, A, M, r.ca);
    cardText(gLines, B, M, r.cb);

    // Raute mit Verb (dw: individuelle halbe Breite für lange Verben)
    const DWr = r.dw || DW;
    gLines.appendChild(el('polygon', {
      points: `${M.x - DWr},${M.y} ${M.x},${M.y - DH} ${M.x + DWr},${M.y} ${M.x},${M.y + DH}`,
      fill: 'var(--surface)', stroke: 'var(--stroke)', 'stroke-width': 1.6, 'stroke-dasharray': dash }));
    gLines.appendChild(el('text', { x: M.x, y: M.y + 5, 'text-anchor': 'middle', 'font-size': 14.5, 'font-weight': 600, fill: 'var(--text)' }, r.verb));

    // Umsetzende FK-Spalten: unter der Raute (waagerecht) bzw. neben der Raute (senkrecht / reflexiv)
    const lines = Array.isArray(r.fks) ? r.fks : [r.fks];
    const beside = r.vertical;
    let x, anchorMode, y0;
    if (beside && r.subSide === 'left') { x = M.x - DWr - 8; anchorMode = 'end'; y0 = M.y + 4 - (lines.length - 1) * 7; }
    else if (beside)                     { x = M.x + DWr + 8; anchorMode = 'start'; y0 = M.y + 4 - (lines.length - 1) * 7; }
    else                                 { x = M.x; anchorMode = 'middle'; y0 = M.y + DH + 15; }
    lines.forEach((txt, i) => gLines.appendChild(el('text', { x, y: y0 + i * 14, 'text-anchor': anchorMode, 'font-size': 12, fill: 'var(--muted)' }, txt)));
  });
  svg.appendChild(gLines);

  // Entitäten
  entities.forEach(e => {
    const s = style[e.kind];
    const g = el('g', {});
    g.appendChild(el('rect', { x: e.x, y: e.y, width: e.w, height: e.h, fill: 'var(--surface)', stroke: 'var(--stroke)', 'stroke-width': 1.6, 'stroke-dasharray': s.dash }));
    g.appendChild(el('rect', { x: e.x, y: e.y, width: e.w, height: HEAD, fill: s.head }));
    g.appendChild(el('line', { x1: e.x, y1: e.y + HEAD, x2: e.x + e.w, y2: e.y + HEAD, stroke: 'var(--stroke)', 'stroke-width': 1.6 }));
    g.appendChild(el('text', { x: e.x + 12, y: e.y + 24, 'font-size': 16, 'font-weight': 700, fill: 'var(--text)' }, e.id));
    if (e.badge) g.appendChild(el('text', { x: e.badgeSide === 'right' ? e.x + e.w : e.x, y: e.y - 7, 'text-anchor': e.badgeSide === 'right' ? 'end' : 'start', 'font-size': 12, fill: 'var(--muted)' }, e.badge));
    e.attrs.forEach((a, i) => {
      const y = e.y + HEAD + 16 + i * ROW;
      const t = el('text', { x: e.x + 12, y, 'font-size': 14, fill: 'var(--text)' });
      t.appendChild(el('tspan', a.pk ? { 'text-decoration': 'underline', 'font-weight': 600 } : {}, a.n));
      if (a.fk) t.appendChild(el('tspan', { fill: 'var(--muted)', 'font-style': 'italic' }, ' (FK)'));
      g.appendChild(t);
    });
    svg.appendChild(g);
  });
})();
</script>
</body>
</html>
